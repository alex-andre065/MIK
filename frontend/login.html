<!DOCTYPE html>
<html lang="pt-pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MIK</title>
  <script src="SCRIPT/tema.js"></script>
  <link rel="stylesheet" href="CSS/style2.css">
  <link rel="stylesheet" href="CSS/tema.css">
</head>
<body>
  <div class="box">
    <h2>Iniciar Sessão</h2>
    <form id="form-login">
      <input type="text" name="login_input" placeholder="E-mail, Telefone ou Usuário" required autocomplete="username">
      <div class="senha-wrapper">
        <input type="password" name="senha" id="senha" placeholder="Palavra-Passe" required autocomplete="current-password">
        <span id="toggleSenha" class="icone-olho" role="button">👁</span>
      </div>
      <button type="submit" id="btn-entrar">Entrar</button>
    </form>
    <div id="msg" class="msg" style="margin-top:15px;font-weight:bold;display:none"></div>
    <p style="margin-top:20px;text-align:center">Não tem conta? <a href="cadastro.html">Criar uma agora</a></p>
  </div>
  <script src="SCRIPT/config.js"></script>
  <script src="SCRIPT/api.js"></script>
  <script src="SCRIPT/senha.js"></script>
  <script src="SCRIPT/bloqueio.js"></script>
  <script>
    if (API.token) location.href = 'index.html';
    document.getElementById('form-login').addEventListener('submit', async function (e) {
      e.preventDefault();
      var fd = new FormData(this);
      var msg = document.getElementById('msg');
      msg.style.display = 'none';
      try {
        var data = await API.login(fd.get('login_input'), fd.get('senha'));
        API.setTokens(data.tokens);
        API.setUser(data.user);
        location.href = 'index.html';
      } catch (err) {
        msg.style.display = 'block';
        msg.style.color = '#dc3545';
        if (err.data && err.data.bloqueio) {
          msg.id = 'contador-bloqueio';
          iniciarContadorBloqueio('contador-bloqueio', err.data.bloqueio.restante, err.data.bloqueio.permanente, ['#btn-entrar']);
        } else {
          msg.textContent = (err.data && err.data.erro) || err.message || 'Erro ao entrar';
        }
      }
    });
  </script>
</body>
</html>
