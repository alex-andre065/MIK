<!DOCTYPE html>
<html lang="pt-pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><script src="SCRIPT/tema.js"></script><link rel="stylesheet" href="CSS/style.css"><link rel="stylesheet" href="CSS/tema.css"><link rel="stylesheet" href="CSS/gerir_membros.css"><title>Histórico de Ações - MIK</title>
<style>.historico-page{padding-top:100px;padding-bottom:40px}.historico-wrap{max-width:1100px;margin:30px auto;padding:0 20px}.historico-wrap h1{color:var(--texto);margin:0 0 10px;font-size:28px}.historico-desc{color:var(--texto-suave);margin-bottom:20px}.badge-acao{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold;color:#fff;white-space:nowrap}.historico-tabela{background:var(--cartao);border-radius:14px;box-shadow:0 4px 12px var(--sombra);overflow:auto}.historico-tabela table{width:100%;border-collapse:collapse}.historico-tabela th,.historico-tabela td{padding:13px 15px;border-bottom:1px solid var(--borda);text-align:left;color:var(--texto)}.historico-tabela th{background:rgba(0,123,255,.06);font-weight:700}.historico-tabela tr:last-child td{border-bottom:0}.historico-meta{font-size:13px;color:var(--texto-suave)}.aviso-tabela{background:#fff3cd;border:1px solid #ffc107;color:#856404;padding:14px;border-radius:10px;margin-bottom:20px;font-size:14px}.paginacao{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}.paginacao a,.paginacao span{display:inline-flex;align-items:center;justify-content:center;min-width:40px;padding:9px 14px;border-radius:9px;text-decoration:none;background:#e8f0fe;color:#007bff;font-weight:600}.paginacao .atual,.paginacao a:hover{background:#007bff;color:#fff}@media(max-width:700px){.historico-wrap{padding:0 12px}.historico-wrap h1{font-size:22px}.historico-tabela th,.historico-tabela td{font-size:13px;padding:10px 8px}.historico-tabela th:last-child,.historico-tabela td:last-child{display:none}}</style></head>
<body class="historico-page"><header id="mik-header"></header><div id="sidebar-overlay" onclick="fecharSidebar()"></div><aside class="sidebar" id="sidebar"><div id="mik-sidebar"></div></aside>
<main class="historico-wrap"><a href="admin.html" class="btn-voltar">← Voltar ao Painel</a><h1>📋 Histórico de Ações</h1><p class="historico-desc">Registo de todas as ações realizadas por administradores no site.</p><div id="lista-historico"><div class="aviso-tabela">A carregar histórico...</div></div></main>
<script src="SCRIPT/config.js"></script><script src="SCRIPT/api.js"></script><script src="SCRIPT/script.js"></script><script src="SCRIPT/layout.js"></script><script>
(function(){if(!MIK_requireAuth())return;MIK_renderShell({subtitulo:'Histórico'});function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}API.historico().then(function(list){var el=document.getElementById('lista-historico');if(!list.length){el.innerHTML='<div class="aviso-tabela">Ainda não existem ações registadas.</div>';return;}var labels={promover_admin:['Promover Admin','#28a745'],despromover_admin:['Despromover','#dc3545'],adicionar_evento:['Novo Evento','#007bff'],eliminar_evento:['Eliminar Evento','#dc3545'],adicionar_imagem:['Nova Imagem','#007bff'],eliminar_imagem:['Eliminar Imagem','#dc3545'],eliminar_mensagem:['Eliminar Mensagem','#dc3545'],senha_seguranca:['Senha Segurança','#6f42c1']};el.innerHTML='<div class="historico-tabela"><table><thead><tr><th>Data / Hora</th><th>Administrador</th><th>Ação</th><th>Detalhes</th><th>IP</th></tr></thead><tbody>'+list.map(function(r){var x=labels[r.acao]||[r.acao,'#6c757d'];return '<tr><td class="historico-meta">'+esc(r.criado_em)+'</td><td><strong>'+esc(r.admin_nome)+'</strong></td><td><span class="badge-acao" style="background:'+x[1]+'">'+esc(x[0])+'</span></td><td>'+esc(r.detalhes||'—')+'</td><td class="historico-meta">'+esc(r.ip||'—')+'</td></tr>';}).join('')+'</tbody></table></div>';}).catch(function(e){document.getElementById('lista-historico').innerHTML='<div class="aviso-tabela">Não foi possível carregar o histórico: '+esc(e.message)+'</div>';});})();
</script></body></html>
