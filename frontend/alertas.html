<!DOCTYPE html>
<html lang="pt-pt">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alertas - MIK</title>
  <script src="SCRIPT/tema.js"></script>
  <link rel="stylesheet" href="CSS/style.css"><link rel="stylesheet" href="CSS/tema.css"><link rel="stylesheet" href="CSS/moderno.css">
</head>
<body>
<header id="mik-header"></header>
<div id="sidebar-overlay" onclick="fecharSidebar()"></div>
<aside class="sidebar" id="sidebar"><div id="mik-sidebar"></div></aside>
<main><div class="container"><a href="admin.html" class="btn-voltar">&larr; Voltar</a><h1>Alertas de Segurança</h1>
<button onclick="marcarTodos()" style="margin-bottom:12px">Marcar todos como lidos</button>
<div id="lista">A carregar...</div></div></main>
<script src="SCRIPT/config.js"></script><script src="SCRIPT/api.js"></script><script src="SCRIPT/script.js"></script><script src="SCRIPT/layout.js"></script>
<script>
MIK_requireAuth(); MIK_renderShell({subtitulo:'Alertas'});
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
async function load(){
  var list = await API.alertas();
  document.getElementById('lista').innerHTML = !list.length ? '<p>Sem alertas.</p>' :
    list.map(function(a){return '<div style="padding:12px;margin:8px 0;border-radius:8px;background:'+(a.lido?'var(--fundo-alt,#f5f5f5)':'rgba(220,53,69,0.12)')+'"><strong>'+esc(a.tipo)+'</strong> — '+esc(a.criado_em)+'<p>'+esc(a.descricao)+'</p>'+(a.lido?'':'<button onclick="marcar('+a.id+')">Marcar lido</button>')+'</div>';}).join('');
}
window.marcar = async function(id){ await API.marcarAlertas({id:id}); load(); };
window.marcarTodos = async function(){ await API.marcarAlertas({todos:true}); load(); };
load().catch(function(e){document.getElementById('lista').textContent=e.message;});
</script>
</body></html>
